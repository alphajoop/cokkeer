name: Code Quality & Build

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality, Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 2️⃣ Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: bun install

      # 4️⃣ Setup Biome
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      # 5️⃣ Format check
      - name: Format code
        run: bun run format

      # 6️⃣ Lint check
      - name: Lint code
        run: bun run lint

      # 7️⃣ Type check / static analysis
      - name: Check code
        run: bun run check

      # 8️⃣ Clean dist
      - name: Clean dist folder
        run: bun run clean

      # 9️⃣ Build TypeScript & bundle
      - name: Build library
        run: bun run build

      # 🔟 Run tests
      - name: Run tests
        run: bun test
